<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="rbihr.css" />
        <title>MLB-RBIHR index</title>
    </head>
    <body>
        <main>

            <script>
                window.onbeforeunload = function () {
                    window.scrollTo(0,0);
                }

                const BASE_URL = 'http://127.0.0.1:8000';
                function callendpoint(url, x, tableId) {
                fetch(url)
                .then(response => response.json())
                .then(data => {console.log(data);
                    const rbihr = data
                    const table = document.getElementById(tableId);
                    for (const rbihr of data) {
                        const row = table.insertRow();
                        const batter_nameCell = row.insertCell();
                        const xCell = row.insertCell();
                        console.log(rbihr)
                        
                        batter_nameCell.textContent = rbihr.batter_name;
                        xCell.textContent = rbihr[x];
                    }})
                .catch(error => {
                    console.error("Failed to fetch table data:", error.message);
                });
            }
            </script>
            
            <div class="stage-wrapper">
                <div class="stage">
                    <div class="col active" data-index="0">
                        <h2>The Table</h2>
                            <table id="hr-table" class="ws-table-all">
                                <script>
                                    callendpoint(BASE_URL + '/homeruns/leaders', 'hr_count', 'hr-table')
                                </script>
                                <tr>
                                    <th>Player</th>
                                    <th>Total HR hit since 2008</th>
                                </tr>
                            </table>
                    </div>

                    <div class="col" data-index="1">
                        <h2>The Regular Stuff</h2>
                            <table id="hr-rbi-table" class="ws-table-all">
                                <script>
                                    callendpoint(BASE_URL +'/homeruns/hr-rbi', 'total_rbi_from_hr', 'hr-rbi-table')
                                </script>
                                <tr>
                                    <th>Player</th>
                                    <th>Total # of RBI from <br>HR hit since 2008</th>
                                </tr>
                            </table>
                    </div>

                    <div class="col" data-index="2">
                        <h2>The Math</h2>
                            <table id="rbi-avg-table" class="ws-table-all">
                                <script>
                                    callendpoint(BASE_URL +'/homeruns/rbi-leaders', 'avg_rbi_per_hr', 'rbi-avg-table')
                                </script>
                                <tr>
                                    <th>Player</th>
                                    <th>Avergage # of RBI per <br>HR hit since 2008</th>
                                </tr>
                            </table>
                    </div>
                </div>
            </div>
            <script>           
            const wrapper = document.querySelector('.stage-wrapper');
            const cols =  document.querySelectorAll('.col');

            function updateActiveColumn() {
                const rect = wrapper.getBoundingClientRect();
                const scrolledIntoWrapper = -rect.top;
                const progress = scrolledIntoWrapper / (wrapper.offsetHeight - window.innerHeight);
                const stepIndex = Math.min(2, Math.max(0, Math.floor(progress * 3)));

                cols.forEach((col, i) => {
                    col.classList.toggle('active', i === stepIndex);
                });
            }

            window.addEventListener('scroll', updateActiveColumn);
            updateActiveColumn();
            </script>
            <hr>
                <ul>
                    <li> <a href="index.html">The RBI Project</a></li>
                    <li> <a href="https://github.com/fsobo4/mlb-rbihr">Project Github Repo</a></li>
                        <span class="icon">
                            <img src="icons/git.bga.svg" alt="Repo">
                        </span>
                    </li>
            </ul>
        </main>
